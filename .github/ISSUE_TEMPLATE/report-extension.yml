name: Report an extension
description: A malicious, abusive or policy-breaking extension, or a counter-notice from an author.
title: "[Report] "
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        Read [REPORTING.md](../blob/main/REPORTING.md) and [POLICY.md](../blob/main/POLICY.md).
        This form is public. A vulnerability or personal data: email the contact in REPORTING.md instead.
  - type: dropdown
    id: kind
    attributes:
      label: What are you sending?
      options:
        - Report of a malicious or abusive extension
        - Counter-notice (I am the author of a removed extension)
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension id
      placeholder: io.github.someone.name
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: policy
    attributes:
      label: Which part of the policy
      options:
        - Circumvents DRM or access controls
        - Downloads copyrighted content without authorization
        - Uses other people's accounts or credentials
        - Fakes Spotify playback or stream reports
        - Malware or destructive behavior
        - Tracking or data collection
        - Impersonation
        - Other
        - Not applicable (counter-notice)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it does and how you know
      description: File and line, behavior, request seen. For a counter-notice, see the list in REPORTING.md (why it does not infringe, your statement, consent to jurisdiction).
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: How to reach you
      description: Only if you want an answer beyond this issue. It is public.
    validations:
      required: false
